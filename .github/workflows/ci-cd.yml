name: CI/CD RefCard01 (Build, Test, Deploy)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: refcard01

jobs:
  # ---------------------------------------------------------------
  # 1) Build + Unit-Tests mit Maven
  # ---------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + Unit-Tests (mvn verify)
        run: mvn -B verify

      - name: JAR als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: app-refcard-01-jar
          path: target/*.jar

  # ---------------------------------------------------------------
  # 2) Docker-Image bauen, Container testen, nach Docker Hub + ghcr pushen
  # ---------------------------------------------------------------
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig für Push nach ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image-Namen bestimmen (Registry-Namen müssen klein geschrieben sein)
        run: |
          echo "DOCKERHUB_IMAGE=docker.io/$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}" >> $GITHUB_ENV
          echo "GHCR_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Docker-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true          # Image lokal behalten, damit es getestet werden kann
          push: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Container starten und testen (Smoke-Test)
        run: |
          docker run -d --name refcard01-test -p 8080:8080 ${DOCKERHUB_IMAGE}:latest
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api > /tmp/api.json; then break; fi
            echo "warte auf App... ($i)"; sleep 2
          done
          echo "Antwort /api:"; cat /tmp/api.json; echo
          grep -q "Application Ref. Card 01" /tmp/api.json
          curl -fs http://localhost:8080/ | grep -q "IP Address (Server)"
          echo "Smoke-Test erfolgreich"

      - name: Container-Logs bei Fehler
        if: failure()
        run: docker logs refcard01-test || true

      # Nur auf main deployen (nicht bei Pull Requests)
      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push nach Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${DOCKERHUB_IMAGE}:latest
          docker push ${DOCKERHUB_IMAGE}:${{ github.sha }}

      # Zusatzaufgabe: zusätzlich in die GitHub Container Registry
      - name: Login GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push nach ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          docker push ${GHCR_IMAGE}:latest
          docker push ${GHCR_IMAGE}:${{ github.sha }}
